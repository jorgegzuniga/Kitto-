name: Render models

on:
  push:
    branches: [main]
    paths: ["models/**", "tools/**", "requirements.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build STL, 3MF and previews
        run: python tools/render.py
      - name: Commit renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          git diff --cached --quiet && exit 0
          git commit -m "Render models [skip ci]"
          # main may have moved while rendering; keep this run's fresh renders on top
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: out/
